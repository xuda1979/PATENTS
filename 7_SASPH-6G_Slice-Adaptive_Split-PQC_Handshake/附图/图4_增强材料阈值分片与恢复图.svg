  <line x1="280" y1="380" x2="360" y2="380" stroke="#000000" stroke-width="3"/>
  <polygon points="360,380 344,372 344,388" fill="#000000"/>

  <line x1="620" y1="380" x2="700" y2="380" stroke="#000000" stroke-width="3"/>
