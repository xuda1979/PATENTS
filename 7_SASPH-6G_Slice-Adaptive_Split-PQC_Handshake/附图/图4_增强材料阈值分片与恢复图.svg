<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <rect x="0" y="0" width="1200" height="850" fill="#ffffff"/>

  <rect x="60" y="320" width="220" height="120" fill="none" stroke="#000000" stroke-width="3"/>
