  <text x="510" y="695" font-size="26" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">阈值恢复</text>
  <text x="510" y="730" font-size="20" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">任意达到 t 个有效片段即可恢复</text>

  <rect x="780" y="680" width="220" height="90" fill="none" stroke="#000000" stroke-width="3"/>
