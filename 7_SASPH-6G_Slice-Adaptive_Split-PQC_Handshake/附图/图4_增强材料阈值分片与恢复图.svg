  <text x="690" y="655" font-size="20" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">达到 t 个有效片段</text>

  <line x1="660" y1="700" x2="780" y2="725" stroke="#000000" stroke-width="3"/>
